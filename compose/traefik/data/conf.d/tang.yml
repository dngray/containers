http:
  services:
    tang:
      loadBalancer:
        servers:
          - url: http://tang:8080

  routers:
    tang-secure:
      rule: Host(`tang1.{{ env "domain" }}`)
      entryPoints:
        - https
      middlewares:
        - hsts-headers@file
        - secure-headers@file
      tls:
        certResolver: stepca
      service: tang@file