http:
  services:
    radicale:
      loadBalancer:
        servers:
          - url: http://radicale:5232

  routers:
    radicale-secure:
      rule: Host(`radicale.{{ env "domain" }}`)
      entryPoints:
        - https
      middlewares:
        - hsts-headers@file
        - secure-headers@file
      tls:
        certResolver: stepca
      service: radicale@file